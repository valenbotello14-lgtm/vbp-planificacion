<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valen Botello — Planificación</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VB Planificación">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --bg:       #000000;
  --panel:    #0A0B0D;
  --surface:  #101215;
  --surface2: #16181C;
  --surface3: #1D2024;
  --border:   #212428;
  --border2:  #2E3237;
  --white:    #FFFFFF;
  --ink:      #EDEEF0;
  --ink2:     #A3A9B0;
  --ink3:     #6B7178;
  --ink4:     #35393E;
  --steel:    #9AA0A6;
  --navy:     #123055;
  --blue:     #0049A8;
  --blue2:    #2E7AD1;
  --blue-ink: #0A1E38;
  --red:      #E2493C; --red-soft:#2A1613;
  --yellow:   #E0A23D; --yellowbg:#2A2210;
  --green:    #3FAE6A; --greenbg:#0F2A1B;
  --purple:   #8C7FE0; --purplebg:#1E1B34;
  --radius:   8px;
  --radius-lg:14px;
  --font-display:'Big Shoulders Display',sans-serif;
  --font-body:'Hanken Grotesk',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--bg);}
body{font-family:var(--font-body);background:var(--bg);color:var(--ink);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;}
::selection{background:var(--blue2);color:#04101E;}

.hero{position:relative;overflow:hidden;background:
    radial-gradient(480px 420px at 8% 20%, rgba(0,73,168,.20), transparent 65%),
    radial-gradient(600px 300px at 95% -10%, rgba(18,48,85,.35), transparent 60%),
    var(--bg);
  border-bottom:1px solid var(--border);}
.hero-inner{position:relative;max-width:1400px;margin:0 auto;padding:22px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;}
.brand img{height:76px;width:auto;display:block;filter:drop-shadow(0 0 22px rgba(0,73,168,.30));}
.header-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.today-badge{font-family:var(--font-mono);font-size:11px;color:var(--ink2);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);padding:7px 11px;border-radius:20px;}
.btn-header{height:36px;padding:0 14px;border-radius:20px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.045);color:var(--ink2);font-family:var(--font-body);font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;transition:all .15s;white-space:nowrap;}
.btn-header:hover{background:rgba(255,255,255,.09);color:var(--white);}
.btn-header.connected{background:var(--greenbg);border-color:#1C4430;color:var(--green);}
.btn-header-white{background:var(--blue2);color:#fff;border-color:var(--blue2);font-weight:700;box-shadow:0 4px 18px -4px rgba(46,122,209,.55);}
.btn-header-white:hover{background:#4A8CDD;border-color:#4A8CDD;}

.main{padding:28px 32px 48px;max-width:1400px;margin:0 auto;}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px;}
.stat{position:relative;background:var(--surface);border:1px solid var(--border);border-top:2px solid var(--stat-c,var(--ink4));border-radius:var(--radius);padding:16px 18px 14px;overflow:hidden;}
.stat::before{content:'';position:absolute;width:70px;height:70px;border-radius:50%;background:var(--stat-c,transparent);opacity:.15;filter:blur(20px);top:-20px;right:-20px;}
.stat-label{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;font-weight:600;position:relative;}
.stat-val{font-family:var(--font-display);font-size:34px;font-weight:800;position:relative;font-variant-numeric:tabular-nums;}
.stat-val.red{color:var(--red);} .stat-val.yellow{color:var(--yellow);} .stat-val.green{color:var(--green);} .stat-val.gray{color:var(--ink3);} .stat-val.white{color:var(--white);} .stat-val.blue{color:var(--blue2);}
.stat.c-red{--stat-c:var(--red);} .stat.c-yellow{--stat-c:var(--yellow);} .stat.c-green{--stat-c:var(--green);} .stat.c-gray{--stat-c:var(--ink3);} .stat.c-blue{--stat-c:var(--blue2);}

.toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap;}
.search-wrap{flex:1;min-width:200px;position:relative;}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none;}
input[type=text],input[type=date],select,textarea{background:var(--surface2);border:1px solid var(--border);color:var(--ink);border-radius:var(--radius);font-family:var(--font-body);font-size:13px;outline:none;transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px var(--blue-ink);}
.search-inp{width:100%;padding:9px 12px 9px 34px;height:38px;}
.filter-select{padding:0 10px;height:38px;cursor:pointer;}
.btn{height:38px;padding:0 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface2);color:var(--ink);font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:all .15s;}
.btn:hover{background:var(--surface3);border-color:var(--border2);}
.btn-primary{background:var(--blue2);border-color:var(--blue2);color:#fff;}
.btn-primary:hover{background:#4A8CDD;border-color:#4A8CDD;}
.btn-danger{border-color:var(--red);color:var(--red);}
.btn-danger:hover{background:var(--red-soft);}

.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
thead th{background:var(--surface2);padding:11px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--surface2);}
td{padding:0;vertical-align:middle;}
td>.cell{padding:13px 16px;}
tr.rowline td:first-child .cell{border-left:3px solid var(--stripe,var(--ink4));padding-left:13px;}
.name-text{font-weight:700;font-size:14px;color:var(--white);}
.athlete-note{font-size:11.5px;color:var(--ink3);margin-top:3px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.injury-tag{font-size:10px;background:var(--purplebg);color:var(--purple);border:1px solid #2E2A50;border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:600;}
.modal-tag{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:500;display:inline-block;}
.tag-online{background:var(--blue-ink);color:var(--blue2);border:1px solid #1D3D63;}
.tag-pres{background:var(--surface3);color:var(--ink2);border:1px solid var(--border);}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.03em;padding:4px 10px;border-radius:6px;white-space:nowrap;text-transform:uppercase;}
.badge .sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.badge-red{background:var(--red-soft);color:var(--red);}
.badge-yellow{background:var(--yellowbg);color:var(--yellow);}
.badge-green{background:var(--greenbg);color:var(--green);}
.badge-gray{background:var(--surface3);color:var(--ink3);}
.badge-injury{background:var(--purplebg);color:var(--purple);}
.date-text{font-family:var(--font-mono);font-size:12.5px;color:var(--ink);}
.urgency{display:flex;align-items:center;gap:10px;}
.utrack{position:relative;width:72px;height:6px;border-radius:4px;background:var(--surface3);flex-shrink:0;}
.utrack::after{content:'';position:absolute;left:23.3%;top:-2px;bottom:-2px;width:1px;background:var(--ink4);}
.ufill{position:absolute;left:0;top:0;bottom:0;border-radius:4px;}
.ufill.red{background:linear-gradient(90deg,#7A2A22,var(--red));}
.ufill.yellow{background:linear-gradient(90deg,#7A5A1A,var(--yellow));}
.ufill.green{background:linear-gradient(90deg,#1E5C3C,var(--green));}
.utrack.empty{background:repeating-linear-gradient(135deg,var(--border2) 0 3px,transparent 3px 6px);}
.days-num{font-family:var(--font-mono);font-size:11.5px;color:var(--ink2);min-width:34px;}
.manual-sel{background:var(--surface2);border:1px solid var(--border);color:var(--ink2);padding:5px 8px;border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--font-body);}
.manual-sel:focus{border-color:var(--blue2);outline:none;}
.icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--ink3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:15px;transition:all .15s;}
.icon-btn:hover{background:var(--surface3);color:var(--ink);}
.icon-btn.del:hover{background:var(--red-soft);color:var(--red);border-color:#4A2622;}
.icon-btn.cal{color:var(--blue2);}
.icon-btn.cal:hover{background:var(--blue-ink);border-color:#1D3D63;}
.icon-btn.cal.synced{color:var(--ink3);border-color:var(--border);}
.actions{display:flex;gap:6px;align-items:center;}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:200;align-items:center;justify-content:center;padding:20px;}
.overlay.open{display:flex;}
.modal{background:var(--panel);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;}
.modal h3{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.01em;margin-bottom:20px;color:var(--white);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 10px;border-radius:var(--radius);}
.form-group textarea{resize:vertical;min-height:70px;}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;}
.empty{text-align:center;padding:48px;color:var(--ink3);font-size:13px;}
.empty-icon{font-size:36px;margin-bottom:12px;}
.cal-info{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:16px;font-size:12px;color:var(--ink2);}
.cal-info strong{color:var(--ink);display:block;margin-bottom:4px;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface3);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 18px;font-size:13px;color:var(--ink);z-index:999;display:flex;align-items:center;gap:10px;transform:translateY(80px);opacity:0;transition:all .3s;max-width:340px;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.success{border-color:#1C4430;background:var(--greenbg);color:var(--green);}
.toast.error{border-color:#4A2622;background:var(--red-soft);color:var(--red);}
@media(max-width:900px){.main{padding:18px 16px 40px;}.hero-inner{padding:18px 16px;}.brand img{height:58px;}.stats{grid-template-columns:repeat(3,1fr);}td.hide-mobile,th.hide-mobile{display:none;}}
@media(max-width:600px){
  .stats{grid-template-columns:repeat(2,1fr);}
  thead th{white-space:normal;font-size:10px;padding:9px 10px;}
  td>.cell{padding:10px 10px;}
  .name-text{font-size:13px;}
  .athlete-note{max-width:140px;}
  .icon-btn{width:27px;height:27px;}
  .actions{gap:3px;}
  .badge{font-size:10.5px;padding:3px 8px;}
}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="brand">
      <img src="logo.png" alt="Valen Botello — Athletic Performance">
    </div>
    <div class="header-right">
      <span class="today-badge" id="today-badge"></span>
      <button class="btn-header" onclick="exportData()" title="Descargar copia de seguridad">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="btn-header" onclick="document.getElementById('import-file').click()" title="Restaurar copia de seguridad">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      </button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
      <button class="btn-header" id="gcal-btn" onclick="toggleGCal()">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span id="gcal-label">Conectar Calendar</span>
      </button>
      <button class="btn-header btn-header-white" onclick="openModal()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        Nuevo alumno
      </button>
    </div>
  </div>
</header>

<main class="main">
  <div class="stats">
    <div class="stat c-blue"><div class="stat-label">Total</div><div class="stat-val white" id="st-total">0</div></div>
    <div class="stat c-red"><div class="stat-label">Vencidos</div><div class="stat-val red" id="st-venc">0</div></div>
    <div class="stat c-yellow"><div class="stat-label">Última semana</div><div class="stat-val yellow" id="st-ult">0</div></div>
    <div class="stat c-green"><div class="stat-label">Al día</div><div class="stat-val green" id="st-ok">0</div></div>
    <div class="stat c-gray"><div class="stat-label">Sin fecha</div><div class="stat-val gray" id="st-sf">0</div></div>
  </div>
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search-inp" id="search" placeholder="Buscar alumno..." oninput="render()">
    </div>
    <select class="filter-select" id="filter-estado" onchange="render()">
      <option value="">Todos los estados</option>
      <option value="vencido">🔴 Vencidos</option>
      <option value="semana">🟡 Última semana</option>
      <option value="ok">🟢 Al día</option>
      <option value="sinfecha">⚪ Sin fecha</option>
    </select>
    <select class="filter-select" id="filter-modal" onchange="render()">
      <option value="">Presencial + Online</option>
      <option value="Presencial">Presencial</option>
      <option value="Online">Online</option>
    </select>
    <button class="btn" onclick="toggleSort()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M7 12h10M11 18h2"/></svg>
      <span id="sort-label">Por urgencia</span>
    </button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Alumno</th>
          <th class="hide-mobile">Modalidad</th>
          <th>Fecha presentación</th>
          <th class="hide-mobile">Urgencia</th>
          <th>Estado</th>
          <th class="hide-mobile">Estado manual</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>

<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <h3 id="modal-title">Nuevo alumno</h3>
    <div class="form-row">
      <div class="form-group"><label>Nombre</label><input type="text" id="f-nombre" placeholder="Ej: Lucas Fernández"></div>
      <div class="form-group"><label>Modalidad</label><select id="f-modal"><option>Presencial</option><option>Online</option></select></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Fecha presentación</label><input type="date" id="f-fecha"></div>
      <div class="form-group"><label>Es lesión</label><select id="f-lesion"><option value="0">No</option><option value="1">Sí</option></select></div>
    </div>
    <div class="form-group"><label>Notas</label><textarea id="f-notas" placeholder="Observaciones, deporte, objetivo..."></textarea></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveAlumno()">Guardar</button>
    </div>
  </div>
</div>

<div class="overlay" id="cal-overlay" onclick="handleCalOverlayClick(event)">
  <div class="modal" style="max-width:420px">
    <h3 style="font-family:var(--font-body);font-size:17px;font-weight:700;">📅 Crear avisos en Google Calendar</h3>
    <p style="font-size:13px;color:var(--ink2);margin-bottom:16px;">Se crearán <strong>2 avisos</strong> para <span id="cal-nombre-preview" style="color:var(--blue2)"></span>:</p>
    <div class="cal-info"><strong>Aviso 1 — 8 días antes</strong><span id="cal-date1-preview"></span></div>
    <div class="cal-info"><strong>Aviso 2 — Sábado anterior</strong><span id="cal-date2-preview"></span></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeCalModal()">Cancelar</button>
      <button class="btn btn-primary" id="cal-confirm-btn" onclick="confirmCreateEvents()">Crear avisos</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CLIENT_ID = '1051287020007-stbg627q90hgu38gq07op3jqfv1ubhsq.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/calendar.events';

const SUPABASE_URL = 'https://czhkhmexmfoqijczaauf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aGtobWV4bWZvcWlqY3phYXVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NzI4ODgsImV4cCI6MjA5ODM0ODg4OH0.PKM93io5PhuzN-3xltGyE_kHMZQufEoe8furKxn93a4';
const TABLE = 'vbp_atletas';

function dbHeaders(extra={}){
  return { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json', ...extra };
}
function rowToAlumno(r){
  return { id:r.id, nombre:r.nombre||'', modal:r.modal||'Presencial', fecha:r.fecha||'', lesion:r.lesion||0, notas:r.notas||'', manual:r.manual||'📝 Sin definir', calSynced:r.calsynced||null, calEventIds:r.caleventids||null };
}
function alumnoToRow(a){
  return { nombre:a.nombre||'', modal:a.modal||'Presencial', fecha:a.fecha||'', lesion:a.lesion||0, notas:a.notas||'', manual:a.manual||'📝 Sin definir', calsynced:a.calSynced||null, caleventids:a.calEventIds||null };
}
async function load(){
  try{
    const resp = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=id.asc`, { headers: dbHeaders() });
    if(!resp.ok) throw new Error('Error de conexión');
    const rows = await resp.json();
    alumnos = rows.map(rowToAlumno);
    nextId = alumnos.length ? Math.max(...alumnos.map(a=>a.id)) + 1 : 1;
    try{localStorage.setItem('vbp_alumnos_cache', JSON.stringify(alumnos));}catch(e){}
  }catch(e){
    showToast('⚠️ Sin conexión a la base de datos. Mostrando última copia local.', 'error');
    try{const c=localStorage.getItem('vbp_alumnos_cache'); alumnos = c?JSON.parse(c):[];}catch(e2){alumnos=[];}
  }
}
async function dbInsert(a){
  const resp = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, { method:'POST', headers: dbHeaders({'Prefer':'return=representation'}), body: JSON.stringify(alumnoToRow(a)) });
  if(!resp.ok) throw new Error('Error al guardar');
  const data = await resp.json();
  return rowToAlumno(data[0]);
}
async function dbUpdate(id,a){
  const resp = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`, { method:'PATCH', headers: dbHeaders({'Prefer':'return=representation'}), body: JSON.stringify(alumnoToRow(a)) });
  if(!resp.ok) throw new Error('Error al actualizar');
  const data = await resp.json();
  return rowToAlumno(data[0]);
}
async function dbDelete(id){
  const resp = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?id=eq.${id}`, { method:'DELETE', headers: dbHeaders() });
  if(!resp.ok) throw new Error('Error al eliminar');
}
function save(){ try{localStorage.setItem('vbp_alumnos_cache', JSON.stringify(alumnos));}catch(e){} }

// ── GOOGLE AUTH ───────────────────────────────────────────────────────
let tokenClient=null,accessToken=null,pendingCalId=null;
function initGoogleAuth(){
  if(typeof google==='undefined'){setTimeout(initGoogleAuth,500);return;}
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPES,callback:(resp)=>{
    if(resp.error){showToast('Error al conectar con Google','error');return;}
    accessToken=resp.access_token;updateCalBtn(true);showToast('✅ Google Calendar conectado','success');
    if(pendingCalAlumno){openCalModal(pendingCalAlumno);pendingCalAlumno=null;}
  }});
}
function toggleGCal(){
  if(accessToken){accessToken=null;updateCalBtn(false);showToast('Desconectado de Google Calendar','');}
  else tokenClient.requestAccessToken();
}
function updateCalBtn(connected){
  document.getElementById('gcal-btn').className='btn-header'+(connected?' connected':'');
  document.getElementById('gcal-label').textContent=connected?'✓ Calendar conectado':'Conectar Calendar';
}

// ── DATE UTILS ────────────────────────────────────────────────────────
function todayStr(){return new Date().toISOString().split('T')[0];}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().split('T')[0];}
function prevSaturday(s){const d=new Date(s+'T00:00:00');const day=d.getDay();const diff=day===6?7:(day+1);d.setDate(d.getDate()-diff);return d.toISOString().split('T')[0];}
function diffDays(s){if(!s)return null;return Math.round((new Date(s+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);}
function fmtDate(d){if(!d)return'—';const[y,m,day]=d.split('-');const ms=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return`${parseInt(day)} ${ms[parseInt(m)-1]} ${y}`;}
function fmtDateLong(d){if(!d)return'—';return new Date(d+'T00:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});}
function getStatus(a){
  const d=diffDays(a.fecha);
  if(d===null)return{key:'sinfecha',label:'Sin fecha',cls:'badge-gray',dot:'var(--ink3)'};
  if(a.lesion)return{key:'lesion',label:'Lesión',cls:'badge-injury',dot:'var(--purple)'};
  if(d<0)return{key:'vencido',label:'Vencido',cls:'badge-red',dot:'var(--red)'};
  if(d<=7)return{key:'semana',label:'Última semana',cls:'badge-yellow',dot:'var(--yellow)'};
  return{key:'ok',label:'Al día',cls:'badge-green',dot:'var(--green)'};
}

// ── CALENDAR ──────────────────────────────────────────────────────────
async function createCalEvent(summary,description,dateStr,colorId){
  const body={summary,description,start:{dateTime:dateStr+'T09:00:00',timeZone:'America/Argentina/Buenos_Aires'},end:{dateTime:dateStr+'T09:30:00',timeZone:'America/Argentina/Buenos_Aires'},colorId:String(colorId),reminders:{useDefault:false,overrides:[{method:'popup',minutes:0},{method:'email',minutes:0}]}};
  const resp=await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events',{method:'POST',headers:{Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!resp.ok)throw new Error('Error al crear evento');
  return resp.json();
}
async function deleteCalEvent(eventId){
  try{await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`,{method:'DELETE',headers:{Authorization:'Bearer '+accessToken}});}catch(e){}
}
async function confirmCreateEvents(){
  const a=pendingCalAlumno;
  if(!a||!a.fecha)return;
  const btn=document.getElementById('cal-confirm-btn');
  btn.disabled=true;
  const hasOld=a.calEventIds&&a.calEventIds.length>0;
  btn.textContent=hasOld?'Actualizando...':'Creando...';
  try{
    if(hasOld)for(const eid of a.calEventIds)await deleteCalEvent(eid);
    const date8=addDays(a.fecha,-8);
    const dateSat=prevSaturday(a.fecha);
    const colorId=a.lesion?11:6;
    const emoji=a.lesion?'🩺':'📋';
    const fvence=fmtDate(a.fecha);
    const ev1=await createCalEvent(`${emoji} PLANIFICACIÓN — ${a.nombre} (vence ${fvence.slice(0,6)})`,`Preparar y presentar nueva planificación para ${a.nombre}. Fecha límite: ${fmtDateLong(a.fecha)}.`,date8,colorId);
    const ev2=await createCalEvent(`${emoji} SAB — ${a.nombre} (presentás ${fvence.slice(0,6)})`,`⚠️ RECORDATORIO SÁBADO — Planificación nueva para ${a.nombre}. Presentación: ${fmtDateLong(a.fecha)}.`,dateSat,colorId);
    const updated={...a,calSynced:a.fecha,calEventIds:[ev1.id,ev2.id]};
    const saved=await dbUpdate(a.id,updated);
    alumnos=alumnos.map(x=>x.id===a.id?saved:x);
    save();closeCalModal();
    showToast(hasOld?`✅ Avisos actualizados para ${a.nombre}`:`✅ 2 avisos creados para ${a.nombre}`,'success');
    render();
  }catch(e){showToast('Error al crear eventos. Reconectá Calendar.','error');accessToken=null;updateCalBtn(false);}
  btn.disabled=false;btn.textContent=hasOld?'Actualizar avisos':'Crear avisos';pendingCalAlumno=null;
}
function requestCalendar(id){
  const a=alumnos.find(x=>x.id===id);
  if(!a)return;
  if(!a.fecha){showToast('Este alumno no tiene fecha de presentación','error');return;}
  pendingCalAlumno=a;
  if(!accessToken){pendingCalId=id;tokenClient.requestAccessToken();return;}
  openCalModal(a);
}
function openCalModal(a){
  pendingCalAlumno=a;
  document.getElementById('cal-nombre-preview').textContent=a.nombre;
  document.getElementById('cal-date1-preview').textContent=fmtDateLong(addDays(a.fecha,-8));
  document.getElementById('cal-date2-preview').textContent=fmtDateLong(prevSaturday(a.fecha));
  document.getElementById('cal-overlay').classList.add('open');
}
function closeCalModal(){document.getElementById('cal-overlay').classList.remove('open');pendingCalAlumno=null;}
function handleCalOverlayClick(e){if(e.target.id==='cal-overlay')closeCalModal();}

// ── DATA STATE ────────────────────────────────────────────────────────
let alumnos=[],nextId=1,editId=null,sortByUrgency=true,pendingCalAlumno=null;

// ── RENDER ────────────────────────────────────────────────────────────
function updateStats(){
  document.getElementById('st-total').textContent=alumnos.length;
  document.getElementById('st-venc').textContent=alumnos.filter(a=>{const d=diffDays(a.fecha);return d!==null&&d<0&&!a.lesion;}).length;
  document.getElementById('st-ult').textContent=alumnos.filter(a=>{const d=diffDays(a.fecha);return d!==null&&d>=0&&d<=7&&!a.lesion;}).length;
  document.getElementById('st-ok').textContent=alumnos.filter(a=>{const d=diffDays(a.fecha);return d!==null&&d>7&&!a.lesion;}).length;
  document.getElementById('st-sf').textContent=alumnos.filter(a=>!a.fecha).length;
}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const fe=document.getElementById('filter-estado').value;
  const fm=document.getElementById('filter-modal').value;
  let list=alumnos.filter(a=>{
    if(q&&!a.nombre.toLowerCase().includes(q))return false;
    if(fm&&a.modal!==fm)return false;
    if(fe){const st=getStatus(a);if(fe==='vencido'&&st.key!=='vencido')return false;if(fe==='semana'&&st.key!=='semana')return false;if(fe==='ok'&&st.key!=='ok')return false;if(fe==='sinfecha'&&st.key!=='sinfecha')return false;}
    return true;
  });
  if(sortByUrgency)list.sort((a,b)=>(diffDays(a.fecha)??9999)-(diffDays(b.fecha)??9999));
  updateStats();
  const tbody=document.getElementById('tbody');
  if(!list.length){tbody.innerHTML=`<tr><td colspan="7" class="empty"><div class="empty-icon">🏋️</div>No hay alumnos que coincidan</td></tr>`;return;}
  tbody.innerHTML=list.map(a=>{
    const st=getStatus(a);
    const d=diffDays(a.fecha);
    const synced=a.calSynced&&a.calSynced===a.fecha;
    let fillPct,fillCls,daysTxt;
    if(d===null){fillPct=0;fillCls='';daysTxt='—';}
    else if(d<0){fillPct=100;fillCls='red';daysTxt=`+${Math.abs(d)}d`;}
    else{fillPct=Math.min(d,30)/30*100;fillCls=d<=7?'yellow':'green';daysTxt=`${d}d`;}
    return`<tr class="rowline" style="--stripe:${st.dot}">
      <td><div class="cell">
        <span class="name-text">${a.nombre}${a.lesion?'<span class="injury-tag">LESIÓN</span>':''}</span>
        ${a.notas?`<div class="athlete-note" title="${a.notas}">${a.notas}</div>`:''}
      </div></td>
      <td class="hide-mobile"><div class="cell"><span class="modal-tag ${a.modal==='Online'?'tag-online':'tag-pres'}">${a.modal}</span></div></td>
      <td><div class="cell"><span class="date-text">${fmtDate(a.fecha)}</span></div></td>
      <td class="hide-mobile"><div class="cell urgency"><div class="utrack${d===null?' empty':''}">${d===null?'':`<div class="ufill ${fillCls}" style="width:${fillPct}%"></div>`}</div><span class="days-num">${daysTxt}</span></div></td>
      <td><div class="cell"><span class="badge ${st.cls}"><span class="sdot" style="background:${st.dot}"></span>${st.label}</span></div></td>
      <td class="hide-mobile"><div class="cell"><select class="manual-sel" onchange="updateManual(${a.id},this.value)">${['📝 Sin definir','✅ Entregado','⏳ En proceso','❌ Pendiente'].map(op=>`<option${a.manual===op?' selected':''}>${op}</option>`).join('')}</select></div></td>
      <td><div class="cell actions">
        <button class="icon-btn cal${synced?' synced':''}" title="${synced?'Avisos ya creados':'Crear avisos en Calendar'}" onclick="requestCalendar(${a.id})">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </button>
        <button class="icon-btn" title="Editar" onclick="openModal(${a.id})">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="icon-btn del" title="Eliminar" onclick="deleteAlumno(${a.id})">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div></td>
    </tr>`;
  }).join('');
}

// ── ACTIONS ───────────────────────────────────────────────────────────
async function updateManual(id,val){
  alumnos=alumnos.map(a=>a.id===id?{...a,manual:val}:a);
  const a=alumnos.find(x=>x.id===id);
  try{ await dbUpdate(id,a); save(); }
  catch(e){ showToast('❌ Error al guardar. Revisá tu conexión.','error'); }
}
async function deleteAlumno(id){
  const a=alumnos.find(x=>x.id===id);
  if(!a||!confirm(`¿Eliminar a ${a.nombre}?`))return;
  try{
    await dbDelete(id);
    alumnos=alumnos.filter(x=>x.id!==id);
    save();render();
    showToast('✅ Alumno eliminado','success');
  }catch(e){ showToast('❌ Error al eliminar. Revisá tu conexión.','error'); }
}
function toggleSort(){sortByUrgency=!sortByUrgency;document.getElementById('sort-label').textContent=sortByUrgency?'Por urgencia':'Orden original';render();}

// ── MODAL ─────────────────────────────────────────────────────────────
function openModal(id=null){
  editId=id;
  document.getElementById('modal-title').textContent=id?'Editar alumno':'Nuevo alumno';
  if(id){const a=alumnos.find(x=>x.id===id);document.getElementById('f-nombre').value=a.nombre;document.getElementById('f-modal').value=a.modal;document.getElementById('f-fecha').value=a.fecha||'';document.getElementById('f-lesion').value=a.lesion?'1':'0';document.getElementById('f-notas').value=a.notas||'';}
  else{document.getElementById('f-nombre').value='';document.getElementById('f-modal').value='Presencial';document.getElementById('f-fecha').value='';document.getElementById('f-lesion').value='0';document.getElementById('f-notas').value='';}
  document.getElementById('overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-nombre').focus(),100);
}
function closeModal(){document.getElementById('overlay').classList.remove('open');editId=null;}
function handleOverlayClick(e){if(e.target.id==='overlay')closeModal();}
async function saveAlumno(){
  const nombre=document.getElementById('f-nombre').value.trim();
  if(!nombre){alert('Ingresá el nombre');return;}
  const obj={nombre,modal:document.getElementById('f-modal').value,fecha:document.getElementById('f-fecha').value||'',lesion:parseInt(document.getElementById('f-lesion').value),notas:document.getElementById('f-notas').value.trim()};
  const btn=document.querySelector('#overlay .btn-primary');
  const originalText=btn.textContent;
  btn.disabled=true;btn.textContent='Guardando...';
  try{
    if(editId){
      const current=alumnos.find(a=>a.id===editId);
      const merged={...current,...obj,calSynced:current.fecha!==obj.fecha?null:current.calSynced};
      const saved=await dbUpdate(editId,merged);
      alumnos=alumnos.map(a=>a.id===editId?saved:a);
    }else{
      const saved=await dbInsert({manual:'📝 Sin definir',calSynced:null,...obj});
      alumnos.push(saved);
      nextId=saved.id+1;
    }
    save();closeModal();render();
    showToast(editId?'✅ Alumno actualizado':'✅ Alumno agregado','success');
  }catch(e){ showToast('❌ Error al guardar. Revisá tu conexión.','error'); }
  btn.disabled=false;btn.textContent=originalText;
}

// ── BACKUP ────────────────────────────────────────────────────────────
function exportData(){
  const data=JSON.stringify(alumnos,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`vbp-athletes-backup-${todayStr()}.json`;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✅ Copia de seguridad descargada','success');
}
function importData(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=async(e)=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data))throw new Error('Formato inválido');
      if(!confirm(`¿Reemplazar todos los datos actuales con esta copia de seguridad? (${data.length} alumnos)`)){event.target.value='';return;}
      showToast('Restaurando datos, no cierres la página...','');
      for(const a of alumnos){try{await dbDelete(a.id);}catch(e2){}}
      const inserted=[];
      for(const a of data){const{id,...rest}=a;const saved=await dbInsert(rest);inserted.push(saved);}
      alumnos=inserted;
      nextId=alumnos.length?Math.max(...alumnos.map(a=>a.id))+1:1;
      save();render();
      showToast(`✅ Datos restaurados: ${alumnos.length} alumnos`,'success');
    }catch(err){showToast('❌ Error al restaurar. Revisá el archivo o tu conexión.','error');}
    event.target.value='';
  };
  reader.readAsText(file);
}

// ── TOAST ─────────────────────────────────────────────────────────────
let toastTimer=null;
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+(type||'');
  setTimeout(()=>t.classList.add('show'),10);
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3500);
}

// ── INIT ──────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeCalModal();}});
document.getElementById('today-badge').textContent=new Date().toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
(async function init(){
  await load();
  render();
  initGoogleAuth();
})();

// ── PWA: instalable en el celular/tablet ────────────────────────────────
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
